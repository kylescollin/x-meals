<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#faf7f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Fox & Bear Kitchen">
<script src="icons.js"></script>
<script src="pwa.js" defer></script>
<title>Fox &amp; Bear Kitchen — This Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="theme.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
  body.editing{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));}
  .container{max-width:680px;margin:0 auto;padding:28px 16px 40px;}
  /* Actions live alone on this row now — the relative label moved down to sit
     with the dates it describes. margin-left:auto rather than
     justify-content:space-between, so the buttons stay pinned right on the
     weeks where the Today button isn't there. */
  .hd-row{display:flex;align-items:center;gap:12px;min-height:36px;}
  .hd-actions{margin-left:auto;}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);}
  h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;line-height:1.15;margin-bottom:6px;}
  .meal-cards{display:flex;flex-direction:column;gap:10px;}

  /* Week switcher. The date range IS the title — there is no static
     "This Week" any more, because you can be looking at any week. The relative
     label sits directly above it, centred, so the two read as one unit. */
  .wk-rel{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);text-align:center;margin-top:10px;}
  /* In timeline view the date row below is hidden, so the label has to carry
     its own bottom spacing or it sits flush against the first week. */
  body.timeline .wk-rel{margin-bottom:24px;}
  .wk-title-row{display:flex;align-items:center;gap:2px;margin:1px -8px 20px;}
  .wk-nav{flex-shrink:0;width:40px;height:40px;border-radius:50%;background:transparent;border:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:color .15s,background .15s;}
  .wk-nav svg{width:22px;height:22px;}
  .wk-nav:hover:not(:disabled){color:var(--accent);background:var(--accent-light);}
  .wk-nav:active:not(:disabled){transform:scale(.88);}
  .wk-nav:disabled{opacity:.22;cursor:default;}
  .wk-title{flex:1;min-width:0;background:none;border:none;padding:2px 0;font-family:'Playfair Display',serif;font-size:29px;font-weight:700;line-height:1.15;color:var(--ink);text-align:center;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .wk-title:active{opacity:.55;}

  /* Go to this week. Only rendered when you've wandered off it, so it's never
     a dead control — and its appearing is itself the signal that you have. */
  .wk-today{flex-shrink:0;width:36px;height:36px;border-radius:50%;background:transparent;border:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:color .15s,background .15s;}
  .wk-today svg{width:21px;height:21px;}
  .wk-today:hover{color:var(--accent);background:var(--accent-light);}
  .wk-today:active{transform:scale(.88);}

  /* Week ⇄ timeline: a calendar grid ("one week, laid out") against a list
     ("everything"). Sits to the right of Edit. */
  .wk-view{display:flex;background:#fff;border:1px solid var(--border);border-radius:100px;padding:2px;}
  .wk-view button{width:38px;height:28px;border:none;background:transparent;border-radius:100px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:background .15s,color .15s;}
  .wk-view button svg{width:16px;height:16px;}
  .wk-view button.on{background:var(--accent-light);color:var(--accent);}

  /* Grocery list, as an object that belongs to this week */
  .gro-card{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:14px;text-decoration:none;color:inherit;-webkit-tap-highlight-color:transparent;transition:border-color .15s;}
  .gro-card:hover{border-color:#bbb;}
  .gro-card:active{transform:scale(.995);}
  .gro-ico{font-size:21px;line-height:1;flex-shrink:0;}
  .gro-body{flex:1;min-width:0;}
  .gro-title{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;margin-bottom:7px;}
  .gro-bar{height:6px;border-radius:99px;background:var(--border);overflow:hidden;}
  .gro-fill{height:100%;background:var(--check);border-radius:99px;width:0;transition:width .3s ease;}
  .gro-count{font-size:12px;color:var(--muted);margin-top:6px;}
  .gro-chev{color:#c9c1b4;font-size:17px;flex-shrink:0;}
  .gro-card.waiting .gro-title{color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;margin:0;}

  /* A week nobody has planned yet */
  .wk-empty{text-align:center;padding:42px 20px 38px;border:1.5px dashed var(--border);border-radius:14px;}
  .wk-empty-t{font-family:'Playfair Display',serif;font-size:19px;font-weight:500;margin-bottom:6px;}
  .wk-empty-s{font-size:13px;color:var(--muted);margin-bottom:20px;}
  .wk-empty-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .wk-empty-actions .edit-toggle{margin-top:0;}

  /* Timeline — the Journal, folded in. Same cards and same activity blocks,
     just every week in one scroll instead of one week at a time. */
  .timeline{display:flex;flex-direction:column;gap:34px;}
  .tl-week{display:flex;flex-direction:column;gap:12px;}
  .tl-head{display:flex;align-items:baseline;gap:10px;width:100%;padding:0 0 10px;border:none;border-bottom:1px solid var(--border);background:none;text-align:left;font-family:'DM Sans',sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .tl-head:active{opacity:.6;}
  .tl-label{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);flex-shrink:0;}
  .tl-range{font-family:'Playfair Display',serif;font-size:18px;font-weight:500;color:var(--ink);flex:1;}
  .tl-count{font-size:12px;color:var(--muted);font-weight:300;flex-shrink:0;}
  .tl-entry{display:flex;flex-direction:column;gap:10px;}
  .tl-loading{font-size:13px;color:var(--muted);font-weight:300;padding:4px 0;}

  /* Week picker sheet */
  .wp-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 20px;display:flex;flex-direction:column;gap:6px;}
  .wp-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;font-family:'DM Sans',sans-serif;-webkit-tap-highlight-color:transparent;transition:border-color .15s;}
  .wp-row:hover{border-color:#bbb;}
  .wp-row.now{border-color:var(--accent);background:var(--accent-light);}
  .wp-range{flex:1;min-width:0;font-family:'Playfair Display',serif;font-size:15px;font-weight:500;color:var(--ink);}
  .wp-meta{font-size:11px;color:var(--muted);flex-shrink:0;}

  /* Edit toggle */
  .edit-toggle{flex-shrink:0;margin-top:18px;background:#fff;border:1px solid var(--border);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;padding:8px 16px;border-radius:100px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s,transform .12s;}
  .edit-toggle:hover{border-color:#bbb;}
  .edit-toggle:active{transform:scale(.95);}
  .hd-actions{display:flex;gap:8px;flex-shrink:0;align-items:flex-start;}
  .edit-toggle.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .edit-toggle.primary:hover{border-color:var(--accent);}

  /* Edit cards */
  .edit-cards{display:flex;flex-direction:column;gap:10px;}
  .edit-card{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 12px;position:relative;will-change:transform;}
  .edit-card.dragging{box-shadow:0 8px 24px rgba(0,0,0,.16);border-color:#bbb;z-index:5;opacity:.97;}
  .ec-handle{flex-shrink:0;width:30px;height:36px;display:flex;align-items:center;justify-content:center;color:#bdb6a8;font-size:18px;cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;}
  .ec-handle:active{cursor:grabbing;}
  .ec-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
  .ec-name{font-family:'Playfair Display',serif;font-size:15px;font-weight:500;line-height:1.3;}
  .ec-remove{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid var(--border);color:var(--muted);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:background .15s,color .15s,border-color .15s;}
  .ec-remove:hover{background:#fdecea;color:#9b2a2a;border-color:#f1c4bd;}
  .ec-remove:active{transform:scale(.9);}

  /* Day-slot grid (edit / plan) */
  .day-grid-edit{display:flex;flex-direction:column;gap:8px;}
  .day-slot{position:relative;border-radius:12px;will-change:transform;}
  .day-slot.dragging{z-index:5;}
  .day-slot.drop-target .ds-inner{border-color:var(--accent);background:var(--accent-light);}
  .ds-label{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 4px 4px;}
  .ds-inner{display:flex;align-items:center;gap:8px;border-radius:10px;padding:10px 10px;transition:border-color .15s,background .15s,box-shadow .15s;}
  .day-slot.filled .ds-inner{background:#fff;border:1px solid var(--border);}
  .day-slot.filled.dragging .ds-inner{box-shadow:0 8px 24px rgba(0,0,0,.16);border-color:#bbb;opacity:.97;}
  .day-slot.empty .ds-inner{background:transparent;border:1.5px dashed var(--border);}
  .ds-name{flex:1;min-width:0;font-family:'Playfair Display',serif;font-size:15px;font-weight:500;line-height:1.3;}
  .ds-empty-actions{flex:1;display:flex;gap:8px;}
  .ds-action{flex:1;background:transparent;border:none;color:var(--accent);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;padding:8px 6px;border-radius:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s;}
  .ds-action:hover{background:#fff;}
  .ds-action.ds-shuffle:active{transform:scale(.95);}
  .ds-action+.ds-action{border-left:1px solid var(--border);}

  /* Bottom edit bar */
  .edit-bar{position:fixed;left:0;right:0;bottom:0;z-index:200;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-top:1px solid var(--border);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.06);}
  .edit-bar .eb-count{font-size:12px;color:var(--muted);font-weight:500;}
  .eb-cancel{background:none;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;padding:8px 6px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .eb-cancel:active{opacity:.6;}
  .eb-done{background:var(--accent);color:#fff;border:none;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;padding:10px 24px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s,background .15s;}
  .eb-done:active{transform:scale(.95);background:#b3581f;}
  .eb-done:disabled{opacity:.6;cursor:default;}

  /* Bottom-sheet overlays (picker + day) */
  .sheet-ov{position:fixed;inset:0;z-index:1200;background:rgba(20,18,15,.4);opacity:0;visibility:hidden;transition:opacity .25s;}
  .sheet-ov.open{opacity:1;visibility:visible;}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--cream);border-radius:18px 18px 0 0;max-height:85vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);padding-bottom:env(safe-area-inset-bottom,0px);}
  .sheet-ov.open .sheet{transform:translateY(0);}
  .sheet-grab{width:38px;height:4px;border-radius:2px;background:var(--border);margin:10px auto 4px;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 12px;border-bottom:1px solid var(--border);}
  .sheet-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;}
  .sheet-close{width:32px;height:32px;border-radius:50%;background:#fff;border:1px solid var(--border);color:var(--ink);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
  .sheet-close:active{background:#eee;}

  /* Recipe picker */
  .picker-search-wrap{padding:12px 16px;border-bottom:1px solid var(--border);}
  /* 16px minimum — anything smaller makes iOS zoom the page in on focus. */
  #picker-search{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;background:#fff;font-family:'DM Sans',sans-serif;font-size:16px;color:var(--ink);outline:none;-webkit-appearance:none;}
  #picker-search:focus{border-color:var(--accent);}
  .picker-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 12px 20px;display:flex;flex-direction:column;gap:6px;}
  .picker-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--border);border-radius:10px;padding:11px 12px;cursor:pointer;font-family:'DM Sans',sans-serif;-webkit-tap-highlight-color:transparent;transition:border-color .15s,background .15s;}
  .picker-row:hover:not(:disabled){border-color:#bbb;}
  .picker-row:active:not(:disabled){background:#faf6ef;}
  .picker-row:disabled{opacity:.5;cursor:default;}
  .picker-row.added{opacity:.55;}
  .picker-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .picker-name{font-family:'Playfair Display',serif;font-size:14px;font-weight:500;color:var(--ink);line-height:1.3;}
  .picker-meta{font-size:11px;color:var(--muted);font-weight:300;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .picker-add{flex-shrink:0;font-size:18px;font-weight:600;color:var(--accent);min-width:24px;text-align:center;}
  .picker-row.added .picker-add{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--check);}
  /* Pinned first row: name a one-off instead of picking a recipe. Outlined when
     it's an option, filled while it's the mode you're in. */
  .picker-row.picker-custom{background:transparent;border-style:dashed;border-color:var(--accent);}
  .picker-row.picker-custom:hover{border-color:var(--accent);background:#fff;}
  .picker-row.picker-custom .picker-name{font-family:'DM Sans',sans-serif;font-weight:600;color:var(--accent);}
  .picker-custom-icon{width:40px;height:40px;flex-shrink:0;border-radius:7px;background:#f0ece5;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;}
  .picker-row.picker-custom.selected{background:var(--accent);border-style:solid;border-color:var(--accent);}
  .picker-row.picker-custom.selected:hover{background:var(--accent);}
  .picker-row.picker-custom.selected:active{background:#b3581f;}
  .picker-row.picker-custom.selected .picker-name{color:#fff;}
  .picker-row.picker-custom.selected .picker-meta{color:rgba(255,255,255,.72);}
  .picker-row.picker-custom.selected .picker-add{color:#fff;font-size:15px;}
  .picker-row.picker-custom.selected .picker-custom-icon{background:rgba(255,255,255,.22);}

  /* Commit bar — only present while naming a one-off. */
  .picker-confirm-wrap{padding:12px 16px;border-top:1px solid var(--border);}
  .picker-confirm{width:100%;background:var(--accent);color:#fff;border:none;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;padding:14px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s,background .15s;}
  .picker-confirm:active:not(:disabled){transform:scale(.98);background:#b3581f;}
  .picker-confirm:disabled{opacity:.45;cursor:default;}
  .picker-loading,.picker-empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:13px;font-weight:300;}

  /* Toast */
  .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:1300;background:var(--ink);color:var(--cream);font-size:13px;font-weight:500;padding:12px 18px;border-radius:100px;box-shadow:0 6px 24px rgba(0,0,0,.22);max-width:90vw;text-align:center;opacity:0;visibility:hidden;transition:opacity .25s,transform .25s;}
  .toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);}
  .toast.success{background:#2d7a4f;}
  .toast.error{background:#9b2a2a;}
</style>
</head>
<body>
<script src="nav.js"></script>
<div class="container">
  <div class="hd-row">
    <button type="button" class="wk-today" id="todayBtn" hidden aria-label="Go to this week"></button>
    <div class="hd-actions">
      <button class="edit-toggle" id="editBtn" style="display:none">Edit</button>
      <button class="edit-toggle primary" id="shuffleWeekBtn" style="display:none">🎲 Shuffle</button>
      <div class="wk-view" id="viewToggle" style="display:none">
        <button type="button" id="viewWeekBtn" class="on" aria-label="One week at a time"></button>
        <button type="button" id="viewTimeBtn" aria-label="Every week"></button>
      </div>
    </div>
  </div>

  <p class="wk-rel" id="relLabel"></p>
  <div class="wk-title-row" id="wkTitleRow">
    <button type="button" class="wk-nav" id="prevWk" aria-label="Previous week"></button>
    <button type="button" class="wk-title" id="wkTitle" aria-label="Jump to a week">…</button>
    <button type="button" class="wk-nav" id="nextWk" aria-label="Next week"></button>
  </div>

  <div id="weekPane">
    <div class="meal-cards" id="mealCards"></div>
    <div id="groceryMount"></div>
  </div>

  <div class="timeline" id="timeline" style="display:none"></div>

  <div id="editPane" style="display:none">
    <div class="day-grid-edit" id="editCards"></div>
  </div>
</div>

<div class="edit-bar" id="editBar" style="display:none">
  <button class="eb-cancel" id="cancelBtn">Cancel</button>
  <span class="eb-count" id="editCount"></span>
  <button class="eb-done" id="doneBtn">Done</button>
</div>

<!-- Recipe picker sheet -->
<div class="sheet-ov" id="picker-overlay" aria-hidden="true">
  <div class="sheet">
    <div class="sheet-grab"></div>
    <div class="sheet-head">
      <span class="sheet-title">Add a meal</span>
      <button class="sheet-close" id="picker-close" aria-label="Close">✕</button>
    </div>
    <div class="picker-search-wrap">
      <input type="search" id="picker-search" placeholder="Search recipes or ingredients…" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="picker-list" id="picker-list"></div>
    <div class="picker-empty" id="picker-empty" style="display:none">No recipes match your search.</div>
    <div class="picker-confirm-wrap" id="picker-confirm-wrap" style="display:none">
      <button class="picker-confirm" id="picker-confirm" disabled>Add</button>
    </div>
  </div>
</div>

<!-- Week picker sheet -->
<div class="sheet-ov" id="weekpick-overlay" aria-hidden="true">
  <div class="sheet">
    <div class="sheet-grab"></div>
    <div class="sheet-head">
      <span class="sheet-title">Jump to a week</span>
      <button class="sheet-close" id="weekpick-close" aria-label="Close">✕</button>
    </div>
    <div class="wp-list" id="weekpick-list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="week-utils.js"></script>
<script src="week-store.js"></script>
<script src="recipe-card.js"></script>
<script type="module">
import { requireAuth, getAuthToken, signOut } from './auth.js';
window.getToken   = getAuthToken;
window.doSignOut  = signOut;
var user = await requireAuth();
if (window.setNavUser) window.setNavUser(user);

var FB_BASE='https://fox-bear-hub-default-rtdb.firebaseio.com';
var REPO='kylescollin/x-meals';
// Sunday first, to match the week the site now runs on.
var DAYS=Week.DAYS;
var DAY_ABBR=Week.ABBR;
var LETTERS='ABCDEFG';

var recipesResp=await fetch('data/recipes.json').then(function(r){return r.json();});
var CORE_IDS={};
(recipesResp.recipes||[]).forEach(function(r){CORE_IDS[r.id]=true;});
// Weekly meals carry no tags of their own — resolve them from the collection.
RecipeCard.setTagIndex(recipesResp.recipes||[]);
// …and old archived weeks carry no ingredients, so fill those in too.
WeekStore.setRecipes(recipesResp.recipes||[]);

// ── Which week are we looking at? ─────────────────────────────────────────
// viewStart is the canonical Sunday; weekKey is the stored weekOf that Firebase,
// the grocery list and every note stamp are keyed by. They are usually but NOT
// always the same string — see week-store.js.
await WeekStore.loadIndex();
var params=new URLSearchParams(location.search);
var viewStart=Week.startOf(params.get('week')||'')||Week.todayStart();
var weekKey=WeekStore.keyOrMint(viewStart);
var weekData=(await WeekStore.get(weekKey))||WeekStore.blank(weekKey);
var loadedAt=weekData.updatedAt||0;

RecipeCard.init({coreIds:CORE_IDS,userEmail:user.email,weekOf:weekKey,onReady:function(){RecipeCard.applyBadges();}});

// ── View rendering ────────────────────────────────────────────────────────
var mealCards=document.getElementById('mealCards');

// Shared by the week view and the timeline so a meal looks the same in both.
function mealCard(m, key){
  var day=m.day ? (DAY_ABBR[m.day]||m.day) + ' ' + (m.date||'') : '';
  // Placeholder meals have no meta, so only join with " · " when there's
  // something to join to — otherwise the line ends in a dangling separator.
  var meta=[day, m.meta||''].filter(Boolean).join(' · ');
  var card=RecipeCard.makeCard(m, null, meta, key);
  if(day && m.meta) card.setAttribute('data-meta-prefix', day + ' · ');
  return card;
}

function renderViewCards(meals){
  mealCards.innerHTML='';
  if(!(meals||[]).length){ mealCards.appendChild(buildEmptyState()); return; }
  meals.forEach(function(m){ mealCards.appendChild(mealCard(m, weekKey)); });
}

function buildEmptyState(){
  var wrap=document.createElement('div');
  wrap.className='wk-empty';
  var past=viewStart<Week.todayStart();
  wrap.innerHTML='<div class="wk-empty-t">'+(past?'Nothing was planned':'Nothing planned yet')+'</div>'+
    '<div class="wk-empty-s">'+Week.rangeLabel(viewStart)+'</div>';
  var actions=document.createElement('div');
  actions.className='wk-empty-actions';
  var plan=document.createElement('button');
  plan.className='edit-toggle primary';
  plan.textContent=past?'Add meals':'Plan this week';
  plan.addEventListener('click',enterEdit);
  var shuf=document.createElement('button');
  shuf.className='edit-toggle';
  shuf.textContent='🎲 Shuffle a week';
  shuf.addEventListener('click',function(){ enterEdit(); shuffleWeek(); });
  actions.appendChild(plan); actions.appendChild(shuf);
  wrap.appendChild(actions);
  return wrap;
}

function renderHeader(){
  var today=Week.todayStart();
  document.getElementById('relLabel').textContent=Week.relativeLabel(viewStart, today);
  document.getElementById('wkTitle').textContent=Week.rangeLabel(viewStart);
  var b=WeekStore.bounds();
  document.getElementById('prevWk').disabled = viewStart<=b.earliest;
  document.getElementById('nextWk').disabled = viewStart>=b.latest;
  // Redrawn each time rather than once at startup, so the numeral is still

// ── Grocery card ──────────────────────────────────────────────────────────
// The list belongs to the week you're looking at, so it lives inside the week
// rather than being a separate destination you have to keep in sync by hand.
var groceryMount=document.getElementById('groceryMount');

function renderGroceryCard(){
  groceryMount.innerHTML='';
  var meals=weekData.meals||[];
  if(!meals.length) return;

  var sections=weekData.groceries||[];
  if(!sections.length){
    // Only worth waiting on for a week that's still ahead of us, and only when
    // there's something the generator can actually shop for.
    var cookable=meals.some(function(m){ return !RecipeCard.isCustom(m); });
    if(!cookable || viewStart<Week.todayStart()) return;
    var wait=document.createElement('div');
    wait.className='gro-card waiting';
    wait.innerHTML='<span class="gro-ico">🛒</span><div class="gro-body"><div class="gro-title">Building your grocery list…</div></div>';
    groceryMount.appendChild(wait);
    return;
  }

  var a=document.createElement('a');
  a.className='gro-card';
  a.href='groceries.html?week='+encodeURIComponent(weekKey);
  a.innerHTML='<span class="gro-ico">🛒</span>'+
    '<div class="gro-body"><div class="gro-title">Grocery List</div>'+
    '<div class="gro-bar"><div class="gro-fill"></div></div>'+
    '<div class="gro-count">…</div></div><span class="gro-chev">›</span>';
  groceryMount.appendChild(a);

  var forKey=weekKey;
  WeekStore.flags(forKey).then(function(flagMap){
    if(forKey!==weekKey) return;           // navigated away while loading
    var p=WeekStore.progress(sections, flagMap);
    a.querySelector('.gro-fill').style.width=p.total?(p.checked/p.total*100)+'%':'0%';
    a.querySelector('.gro-count').textContent=p.checked+' of '+p.total+' items checked';
  });
}

// ── Navigating between weeks ──────────────────────────────────────────────
async function goToWeek(startISO){
  if(editMode!=='off') return;
  var b=WeekStore.bounds();
  if(startISO<b.earliest||startISO>b.latest) return;
  viewStart=startISO;
  weekKey=WeekStore.keyOrMint(viewStart);
  renderHeader();
  mealCards.innerHTML='';
  groceryMount.innerHTML='';
  weekData=(await WeekStore.get(weekKey))||WeekStore.blank(weekKey);
  loadedAt=weekData.updatedAt||0;
  // Notes added from the detail sheet stamp against the week on screen.
  RecipeCard.setWeekOf(weekKey);
  renderViewCards(weekData.meals);
  renderGroceryCard();
  RecipeCard.refresh();
  var q=(viewStart===Week.todayStart())?'':'?week='+viewStart;
  history.replaceState(null,'',location.pathname+q);
  prefetchNeighbours();
}

function prefetchNeighbours(){
  [Week.add(viewStart,-1),Week.add(viewStart,1)].forEach(function(s){
    var k=WeekStore.keyFor(s);
    if(k) WeekStore.get(k);
  });
}

renderHeader();
renderViewCards(weekData.meals);
renderGroceryCard();
prefetchNeighbours();

document.getElementById('viewToggle').style.display='';

// ── Edit state ────────────────────────────────────────────────────────────
var editMeals=[];
var pickerTargetDay=null;   // which day the recipe picker is adding to
var pickerCustomMode=false; // picker is naming a one-off meal, not searching recipes
var allRecipes=null;
var editMode='off';         // 'off' | 'edit' — there is no separate "plan" mode
                            // any more: planning next week is editing next week.

var idOf=RecipeCard.idOf;   // shared slug helper (see recipe-card.js)
var isCustom=RecipeCard.isCustom;   // placeholder meal? (see recipe-card.js)

// Does the week contain anything the grocery generator can actually shop for?
function hasCookable(meals){ return (meals||[]).some(function(m){ return !isCustom(m); }); }

// Dates come off the canonical Sunday, NOT off the stored weekOf — the keys we
// inherited land on Mondays, a Tuesday and a Thursday, so offsetting from the
// raw key with a Sunday-first day list would put every meal on the wrong date.
function dateForDay(day){ return Week.dateForDay(viewStart, day); }

// The meal occupying a given day (at most one), or null.
function mealForDay(day){
  for(var i=0;i<editMeals.length;i++){ if(editMeals[i].day===day) return editMeals[i]; }
  return null;
}

// Keep editMeals ordered by day so array order = week order (Meal A…G follow the days).
function sortMealsByDay(){
  editMeals.sort(function(a,b){ return DAYS.indexOf(a.day)-DAYS.indexOf(b.day); });
}

function reletterAndDate(meals){
  return meals.map(function(m,i){
    var day=m.day||DAYS[i]||'Monday';
    return Object.assign({}, m, { label:'Meal '+LETTERS[i], day:day, date:dateForDay(day) });
  });
}

// Kept in the stored week even though the page no longer shows it — the field
// is part of the documented schema and Agent X still writes it.
function recomputeSubhead(sub, n){
  sub=sub||'';
  var label=n+' '+(n===1?'dinner':'dinners');
  if(/^\s*\d+\s+dinners?/.test(sub)) return sub.replace(/^\s*\d+\s+dinners?/, label);
  return label;
}

// ── Day-slot grid ─────────────────────────────────────────────────────────
function renderEditCards(){
  var c=document.getElementById('editCards');
  c.innerHTML='';
  DAYS.forEach(function(day){ c.appendChild(buildDaySlot(day)); });

  var n=editMeals.length;
  document.getElementById('editCount').textContent=
    Week.rangeLabel(viewStart)+' · '+n+(n===1?' meal':' meals');
  document.getElementById('doneBtn').disabled=false;
}

function buildDaySlot(day){
  var meal=mealForDay(day);
  var slot=document.createElement('div');
  slot.className='day-slot '+(meal?'filled':'empty');
  slot.dataset.day=day;

  var label=document.createElement('div');
  label.className='ds-label';
  label.textContent=(DAY_ABBR[day]||day)+' · '+dateForDay(day);

  var inner=document.createElement('div'); inner.className='ds-inner';

  if(meal){
    var handle=document.createElement('div');
    handle.className='ec-handle'; handle.textContent='⠿';
    handle.setAttribute('aria-label','Drag to move to another day');

    var icon=RecipeCard.makeThumb(meal,'rc-thumb-sm');

    var name=document.createElement('div');
    name.className='ds-name'; name.textContent=meal.name;

    var rm=document.createElement('button');
    rm.className='ec-remove'; rm.textContent='✕';
    rm.setAttribute('aria-label','Remove '+meal.name);
    rm.addEventListener('click',function(){
      editMeals=editMeals.filter(function(m){ return m.day!==day; });
      renderEditCards();
    });

    inner.appendChild(handle); inner.appendChild(icon); inner.appendChild(name); inner.appendChild(rm);
    slot.appendChild(label); slot.appendChild(inner);
    setupDrag(slot, handle, day);
  }else{
    var actions=document.createElement('div'); actions.className='ds-empty-actions';
    var addBtn=document.createElement('button');
    addBtn.className='ds-action ds-add'; addBtn.textContent='+ Add';
    addBtn.addEventListener('click',function(){ openPickerForDay(day); });
    var shufBtn=document.createElement('button');
    shufBtn.className='ds-action ds-shuffle'; shufBtn.textContent='🎲 Shuffle';
    shufBtn.addEventListener('click',function(){ shuffleDay(day); });
    actions.appendChild(addBtn); actions.appendChild(shufBtn);
    inner.appendChild(actions);
    slot.appendChild(label); slot.appendChild(inner);
  }
  return slot;
}

// ── Drag a meal between days (Pointer Events) ─────────────────────────────
// Lifts the dragged slot, highlights the day-row under the pointer, and on
// release moves the meal to an empty day or swaps with an occupied one.
function setupDrag(slot, handle, fromDay){
  handle.addEventListener('pointerdown', function(e){
    e.preventDefault();
    var container=document.getElementById('editCards');
    var slots=Array.from(container.children);
    var rects=slots.map(function(s){ return s.getBoundingClientRect(); });
    var startY=e.clientY;
    var targetDay=fromDay;
    try{ slot.setPointerCapture(e.pointerId); }catch(_){}
    slot.classList.add('dragging');

    function clearHighlight(){
      slots.forEach(function(s){ s.classList.remove('drop-target'); });
    }
    function move(ev){
      var dy=ev.clientY-startY;
      slot.style.transform='translateY('+dy+'px)';
      // Which day-row is the pointer centred over?
      var y=ev.clientY, over=null;
      for(var i=0;i<slots.length;i++){
        if(y>=rects[i].top && y<=rects[i].bottom){ over=slots[i]; break; }
      }
      clearHighlight();
      targetDay=over?over.dataset.day:fromDay;
      if(over && over!==slot) over.classList.add('drop-target');
    }
    function end(){
      try{ slot.releasePointerCapture(e.pointerId); }catch(_){}
      slot.removeEventListener('pointermove',move);
      slot.removeEventListener('pointerup',end);
      slot.removeEventListener('pointercancel',end);
      slot.classList.remove('dragging');
      slot.style.transform='';
      clearHighlight();
      if(targetDay && targetDay!==fromDay){
        var dragged=mealForDay(fromDay);
        var other=mealForDay(targetDay);
        if(dragged){
          dragged.day=targetDay;
          if(other) other.day=fromDay;   // swap
          sortMealsByDay();
        }
      }
      renderEditCards();
    }
    slot.addEventListener('pointermove',move);
    slot.addEventListener('pointerup',end);
    slot.addEventListener('pointercancel',end);
  });
}

// ── Recipe picker ─────────────────────────────────────────────────────────
function loadAllRecipes(cb){
  if(allRecipes){ cb(allRecipes); return; }
  RecipeCard.loadSavedRecipes(function(saved){
    var seen={}, combined=[];
    (recipesResp.recipes||[]).forEach(function(r){ var id=idOf(r); if(!seen[id]){ seen[id]=1; combined.push(r); } });
    (saved||[]).forEach(function(r){ var id=idOf(r); if(!seen[id]){ seen[id]=1; combined.push(r); } });
    combined.sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
    allRecipes=combined; cb(combined);
  });
}

// The pinned first row of the picker. Tapping it selects a mode: the row fills
// in, the recipe list disappears, and the search box becomes the name field for
// a one-off meal (eating out, leftovers, cooking something off-plan). Tapping it
// again backs out to searching. It's one <button>, so the ✕ is an affordance
// rather than its own control — anywhere on the row toggles.
function buildCustomRow(){
  var row=document.createElement('button');
  row.className='picker-row picker-custom'+(pickerCustomMode?' selected':'');
  var ic=document.createElement('span'); ic.className='picker-custom-icon'; ic.textContent='✏️';
  var info=document.createElement('span'); info.className='picker-info';
  var nm=document.createElement('span'); nm.className='picker-name';
  var mt=document.createElement('span'); mt.className='picker-meta';
  nm.textContent='Something else…';
  mt.textContent=pickerCustomMode ? 'One-off · no groceries' : 'Eating out, leftovers, off-plan';
  info.appendChild(nm); info.appendChild(mt);
  var add=document.createElement('span'); add.className='picker-add'; add.textContent=pickerCustomMode?'✕':'+';
  row.appendChild(ic); row.appendChild(info); row.appendChild(add);
  row.addEventListener('click',function(){ setCustomMode(!pickerCustomMode); });
  return row;
}

// Enter or leave name-a-one-off mode. The typed text is deliberately kept in
// both directions — a half-typed search is a fine start for a name, and vice versa.
function setCustomMode(on, opts){
  opts=opts||{};
  pickerCustomMode=!!on;
  var searchEl=document.getElementById('picker-search');
  searchEl.placeholder = on ? 'What are you eating?' : 'Search recipes or ingredients…';
  searchEl.setAttribute('enterkeyhint', on ? 'done' : 'search');
  if(on && !opts.noFocus) searchEl.focus();
  renderPickerList(searchEl.value);
}

// The bottom bar only exists in custom mode, and only commits once there's a name.
function syncConfirmBar(){
  var wrap=document.getElementById('picker-confirm-wrap');
  var btn=document.getElementById('picker-confirm');
  wrap.style.display = pickerCustomMode ? '' : 'none';
  if(!pickerCustomMode) return;
  btn.textContent = pickerTargetDay ? ('Add to '+pickerTargetDay) : 'Add meal';
  btn.disabled = !(document.getElementById('picker-search').value||'').trim();
}

function renderPickerList(q){
  q=(q||'').trim().toLowerCase();
  var listEl=document.getElementById('picker-list');
  var emptyEl=document.getElementById('picker-empty');
  listEl.innerHTML='';
  listEl.appendChild(buildCustomRow());   // always first, whatever the search says
  syncConfirmBar();
  if(pickerCustomMode){
    // Naming a one-off — the search box isn't searching, so there's nothing to list.
    emptyEl.style.display='none';
    return;
  }
  var inWeek={}; editMeals.forEach(function(m){ inWeek[m.id]=true; });
  var shown=0;
  (allRecipes||[]).forEach(function(r){
    var hay=[r.name, r.meta, (r.ingredients||r.ings||[]).join(' ')].join(' ').toLowerCase();
    if(q && hay.indexOf(q)<0) return;
    var id=idOf(r);
    var already=!!inWeek[id];
    var row=document.createElement('button');
    row.className='picker-row'+(already?' added':'');
    row.disabled=already;
    var ic=RecipeCard.makeThumb(r,'rc-thumb-sm');
    var info=document.createElement('span'); info.className='picker-info';
    var nm=document.createElement('span'); nm.className='picker-name'; nm.textContent=r.name;
    var mt=document.createElement('span'); mt.className='picker-meta'; mt.textContent=r.meta||'';
    info.appendChild(nm); info.appendChild(mt);
    var add=document.createElement('span'); add.className='picker-add'; add.textContent=already?'Added':'+';
    row.appendChild(ic); row.appendChild(info); row.appendChild(add);
    if(!already) row.addEventListener('click',function(){ addMeal(r); });
    listEl.appendChild(row); shown++;
  });
  emptyEl.style.display = (shown===0) ? 'block' : 'none';
}

function mealFromRecipe(r, day){
  var meal={
    id:idOf(r), icon:r.icon||'🍽', name:r.name, meta:r.meta||'',
    ings:(r.ings||r.ingredients||[]).slice(),
    steps:(r.steps||[]).slice(),
    day:day
  };
  if(r.note) meal.note=r.note;
  return meal;
}

// A placeholder meal — a name and nothing else. Carries no ingredients, is never
// clickable, and is skipped by grocery generation. The id gets a timestamp plus
// random chars (same convention as photo keys) so each one has its own photo/note
// bucket — two "Takeout" nights in the same week stay separate.
function mealFromCustom(name, day){
  var clean=(name||'').trim();
  var slug=clean.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'meal';
  return {
    id:'custom-'+slug+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    custom:true,
    icon:'🍽',
    name:clean.charAt(0).toUpperCase()+clean.slice(1),
    meta:'',
    ings:[], steps:[],
    day:day
  };
}

// Open the recipe picker so the chosen recipe lands on a specific day.
function openPickerForDay(day){
  pickerTargetDay=day;
  // Always open on the recipe list. noFocus: the keyboard shouldn't fight the
  // sheet animation, and the render below is replaced by the loading placeholder.
  setCustomMode(false, {noFocus:true});
  document.getElementById('picker-search').value='';
  document.getElementById('picker-list').innerHTML='<div class="picker-loading">Loading recipes…</div>';
  openSheet('picker-overlay');
  loadAllRecipes(function(){ renderPickerList(''); });
}

function addMeal(r){
  var day=pickerTargetDay||nextEmptyDay();
  if(!day){ closeSheet('picker-overlay'); return; }
  editMeals=editMeals.filter(function(m){ return m.day!==day; });  // replace any meal on that day
  editMeals.push(mealFromRecipe(r, day));
  sortMealsByDay();
  closeSheet('picker-overlay');
  renderEditCards();
}

function addCustomMeal(name){
  if(!(name||'').trim()) return;
  var day=pickerTargetDay||nextEmptyDay();
  if(!day){ closeSheet('picker-overlay'); return; }
  editMeals=editMeals.filter(function(m){ return m.day!==day; });  // replace any meal on that day
  editMeals.push(mealFromCustom(name, day));
  sortMealsByDay();
  pickerCustomMode=false;   // next open starts on the recipe list
  closeSheet('picker-overlay');
  renderEditCards();
}

function nextEmptyDay(){
  for(var i=0;i<DAYS.length;i++){ if(!mealForDay(DAYS[i])) return DAYS[i]; }
  return null;
}

// Pick a random recipe for one day, avoiding any recipe already in the week and
// the day's current meal — so tapping repeatedly always rolls something new.
function shuffleDay(day){
  loadAllRecipes(function(list){
    var used={}; editMeals.forEach(function(m){ if(m.day!==day) used[m.id]=true; });
    var curId=(mealForDay(day)||{}).id;
    var pool=(list||[]).filter(function(r){ var id=idOf(r); return !used[id] && id!==curId; });
    if(!pool.length){
      // Everything else is already in the week; allow anything but the current meal.
      pool=(list||[]).filter(function(r){ return idOf(r)!==curId; });
    }
    if(!pool.length){ toast('No other recipes to shuffle in yet.', {}); return; }
    var pick=pool[Math.floor(Math.random()*pool.length)];
    editMeals=editMeals.filter(function(m){ return m.day!==day; });
    editMeals.push(mealFromRecipe(pick, day));
    sortMealsByDay();
    renderEditCards();
  });
}

// Replace the whole week with a fresh set of 3 distinct random meals (Mon/Tue/Wed),
// matching the "3 dinners" default. Re-tap to reshuffle.
var SHUFFLE_DAYS=['Monday','Tuesday','Wednesday'];
function shuffleWeek(){
  // Throws away whatever is already on the week — confirm first, unless the
  // week is empty (in which case there's nothing to lose).
  if(editMeals.length){
    if(!confirm('Replace all '+editMeals.length+' meal'+(editMeals.length===1?'':'s')+' with a random week?')) return;
  }
  loadAllRecipes(function(list){
    var pool=(list||[]).slice();
    if(!pool.length){ toast('No recipes to shuffle yet.', {}); return; }
    var n=Math.min(3, pool.length);
    var prevIds=editMeals.map(function(m){return m.id;}).sort().join(',');
    for(var attempt=0; attempt<8; attempt++){
      // Fisher–Yates partial shuffle to pick n distinct recipes
      var arr=pool.slice();
      for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
      var picks=arr.slice(0,n);
      var pickIds=picks.map(idOf).sort().join(',');
      // re-roll if identical to current set and there's room to differ
      if(pickIds!==prevIds || pool.length<=n){
        editMeals=[];
        picks.forEach(function(r,k){ editMeals.push(mealFromRecipe(r, SHUFFLE_DAYS[k]||DAYS[k])); });
        sortMealsByDay();
        renderEditCards();
        return;
      }
    }
  });
}

// ── Sheet helpers ─────────────────────────────────────────────────────────
function openSheet(id){
  var ov=document.getElementById(id);
  ov.classList.add('open'); ov.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}
function closeSheet(id){
  var ov=document.getElementById(id);
  ov.classList.remove('open'); ov.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
}

// ── Toast ─────────────────────────────────────────────────────────────────
function toast(msg, opts){
  opts=opts||{};
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast show'+(opts.error?' error':'')+(opts.success?' success':'');
  if(t._timer) clearTimeout(t._timer);
  if(!opts.persist){ t._timer=setTimeout(function(){ t.className='toast'; }, opts.error?6500:4000); }
}

// ── Enter / exit edit mode ────────────────────────────────────────────────
// Editing always targets the week on screen. Planning next week is stepping
// forward a week and editing it — there is no separate publish step, and no
// archiving, because no week is special any more.
function enterEdit(){
  editMode='edit';
  editMeals=(weekData.meals||[]).map(function(m){ return Object.assign({}, m); });
  sortMealsByDay();
  document.getElementById('doneBtn').textContent='Done';
  document.getElementById('weekPane').style.display='none';
  document.getElementById('editBtn').style.display='none';
  document.getElementById('viewToggle').style.display='none';
  document.getElementById('shuffleWeekBtn').style.display='';
  document.getElementById('editPane').style.display='';
  document.getElementById('editBar').style.display='';
  document.getElementById('prevWk').disabled=true;
  document.getElementById('nextWk').disabled=true;
  document.getElementById('todayBtn').hidden=true;
  document.body.classList.add('editing');
  renderEditCards();
}
function exitEdit(){
  closeSheet('picker-overlay');
  editMode='off';
  document.getElementById('editPane').style.display='none';
  document.getElementById('editBar').style.display='none';
  document.getElementById('shuffleWeekBtn').style.display='none';
  document.getElementById('weekPane').style.display='';
  document.getElementById('editBtn').style.display='';
  document.getElementById('viewToggle').style.display='';
  document.getElementById('doneBtn').textContent='Done';
  renderHeader();
}

// ── GitHub commit (triggers grocery regeneration) ─────────────────────────
function utf8ToBase64(str){ return btoa(unescape(encodeURIComponent(str))); }

async function getGhToken(){
  var tk=await getAuthToken();
  var r=await fetch(FB_BASE+'/config/githubToken.json?auth='+tk);
  if(!r.ok) return null;
  var v=await r.json();
  return (typeof v==='string' && v) ? v : null;
}

// Commit one week file. A week you've never planned before has no file yet, so
// a 404 on the read is normal — that's a create, not an error. A 409 on the
// write means someone else committed in the last few seconds; re-read the sha
// and try once more.
async function commitWeekFile(weekObj){
  var gh=await getGhToken();
  if(!gh){ var e=new Error('no token'); e.code='no-token'; throw e; }
  var url='https://api.github.com/repos/'+REPO+'/contents/data/weeks/'+weekObj.weekOf+'.json';
  var headers={ 'Authorization':'Bearer '+gh, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' };
  var content=utf8ToBase64(JSON.stringify(weekObj, null, 2)+'\n');

  async function shaOf(){
    var r=await fetch(url+'?ref=main', { headers:headers, cache:'no-store' });
    if(r.status===404) return null;                     // new week
    if(!r.ok){ var e2=new Error('get failed'); e2.code='get'; throw e2; }
    return (await r.json()).sha;
  }
  async function put(sha){
    var body={ message:'Edit week '+weekObj.weekOf+' meal plan (in-app)', content:content, branch:'main' };
    if(sha) body.sha=sha;
    return fetch(url, { method:'PUT', headers:headers, body:JSON.stringify(body) });
  }

  var r=await put(await shaOf());
  if(r.status===409 || r.status===422) r=await put(await shaOf());
  if(!r.ok){ var e3=new Error('put failed'); e3.code='put'; throw e3; }
  return true;
}

// Wait for CI to bring the grocery list in line with the meals we just saved.
// The old check ("are there any groceries yet?") no longer works now that the
// list is merged rather than rebuilt from empty — an unchanged non-empty list
// looks identical. CI stamps groceriesAt, so watch that instead.
function pollGroceries(sinceStamp){
  var forKey=weekKey, tries=0, max=26;   // ~3.5 min at 8s
  var iv=setInterval(async function(){
    tries++;
    if(forKey!==weekKey){ clearInterval(iv); return; }
    try{
      var d=await WeekStore.get(forKey, true);
      if(d && (d.groceriesAt||'')!==(sinceStamp||'')){
        clearInterval(iv);
        weekData=d; loadedAt=d.updatedAt||0;
        renderViewCards(weekData.meals); renderGroceryCard(); RecipeCard.refresh();
        toast('Grocery list updated ✓', {success:true});
        return;
      }
    }catch(_){}
    if(tries>=max){ clearInterval(iv); toast('Still updating — check the grocery list in a minute.', {}); }
  }, 8000);
}

// ── Save ──────────────────────────────────────────────────────────────────
// One path for every week. Nothing gets archived or displaced, because the
// week you are editing is just a document like all the others.
async function save(){
  var doneBtn=document.getElementById('doneBtn');
  doneBtn.disabled=true; doneBtn.textContent='Saving…';

  var meals=reletterAndDate(editMeals);
  var week=Object.assign({}, weekData, {
    weekOf:weekKey,
    title:weekData.title||Week.titleFor(viewStart),
    subhead:recomputeSubhead(weekData.subhead, meals.length),
    meals:meals,
    // Groceries are left exactly as they are. CI reconciles them against the
    // new meals and preserves anything already ticked off — the list is never
    // thrown away to force a rebuild.
    groceries:weekData.groceries||[]
  });
  var sinceStamp=weekData.groceriesAt||'';

  try{
    await WeekStore.put(weekKey, week, loadedAt);
  }catch(e){
    doneBtn.disabled=false; doneBtn.textContent='Done';
    if(e && e.code==='conflict'){
      toast('This week changed on another device. Reload to see it before editing.', {error:true});
    }else{
      toast("Couldn't save — check your connection and try again.", {error:true});
    }
    return;
  }

  var committed=false, commitErr=null;
  try{ await commitWeekFile(week); committed=true; }
  catch(e){ commitErr=e; }

  weekData=week; loadedAt=week.updatedAt||0;
  exitEdit();
  renderViewCards(weekData.meals);
  renderGroceryCard();
  RecipeCard.refresh();
  doneBtn.disabled=false; doneBtn.textContent='Done';

  if(committed && !hasCookable(meals)){
    // Nothing but placeholders — CI has nothing to shop for, so don't sit and wait.
    toast('Meals saved.', {success:true});
  }else if(committed){
    toast('Meals saved · grocery list updating…', {persist:true});
    pollGroceries(sinceStamp);
  }else{
    var why = (commitErr && commitErr.code==='no-token') ? "grocery auto-update isn't set up yet" : "couldn't reach GitHub";
    toast('Meals saved. Grocery list not refreshed ('+why+').', {error:true});
  }
}

// ── Timeline ──────────────────────────────────────────────────────────────
// The Journal, folded into this page. Same cards, same activity blocks — but
// week headers render straight from the index and each week's contents load
// only when you scroll to it, instead of fetching every week ever on open.
var timelineEl=document.getElementById('timeline');
var timelineBuilt=false;
var tlObserver=null;

function buildTimeline(){
  if(timelineBuilt) return;
  timelineBuilt=true;
  var today=Week.todayStart();
  var all=WeekStore.starts().slice().reverse();   // newest first

  tlObserver=new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(!en.isIntersecting) return;
      tlObserver.unobserve(en.target);
      fillTimelineWeek(en.target);
    });
  }, {rootMargin:'600px 0px'});

  all.forEach(function(start){
    var key=WeekStore.keyFor(start);
    var sec=document.createElement('section');
    sec.className='tl-week';
    sec.dataset.key=key;
    sec.dataset.start=start;
    // Reserve height so lazily-arriving content doesn't shove the scroll
    // position around under your thumb.
    sec.style.minHeight='210px';

    var head=document.createElement('button');
    head.type='button';
    head.className='tl-head';
    var rel=Week.relativeLabel(start, today);
    head.innerHTML='<span class="tl-label">'+(/^\w+ \d{4}$/.test(rel)?'':rel)+'</span>'+
      '<span class="tl-range">'+Week.rangeLabel(start, {year:true})+'</span>'+
      '<span class="tl-count"></span>';
    head.addEventListener('click',function(){ setView('week'); goToWeek(start); });
    sec.appendChild(head);

    var body=document.createElement('div');
    body.className='tl-body';
    body.innerHTML='<div class="tl-loading">Loading…</div>';
    sec.appendChild(body);

    timelineEl.appendChild(sec);
    tlObserver.observe(sec);
  });

  // Fill the first couple eagerly so switching views never shows a blank page.
  Array.prototype.slice.call(timelineEl.children,0,2).forEach(function(sec){
    tlObserver.unobserve(sec); fillTimelineWeek(sec);
  });
}

async function fillTimelineWeek(sec){
  var key=sec.dataset.key;
  var week=await WeekStore.get(key);
  var body=sec.querySelector('.tl-body');
  body.innerHTML='';
  var meals=(week&&week.meals)||[];
  sec.querySelector('.tl-count').textContent=meals.length+(meals.length===1?' meal':' meals');
  if(!meals.length){
    body.innerHTML='<div class="tl-loading">Nothing planned.</div>';
  }else{
    meals.forEach(function(m){
      var wrap=document.createElement('div');
      wrap.className='tl-entry';
      wrap.appendChild(mealCard(m, key));
      wrap.appendChild(RecipeCard.makeActivity(m, key));
      body.appendChild(wrap);
    });
  }
  sec.style.minHeight='';
  // These cards weren't in the DOM when the shared data loaded, so they have
  // no badges, edits or activity counts until we ask for them.
  RecipeCard.refresh();
}

function setView(mode){
  var timeline=(mode==='timeline');
  document.getElementById('viewWeekBtn').classList.toggle('on',!timeline);
  document.getElementById('viewTimeBtn').classList.toggle('on',timeline);
  document.getElementById('weekPane').style.display=timeline?'none':'';
  document.getElementById('wkTitleRow').style.display=timeline?'none':'';
  document.getElementById('editBtn').style.display=timeline?'none':'';
  timelineEl.style.display=timeline?'':'none';
  document.body.classList.toggle('timeline',timeline);
  if(timeline){
    // No single week on screen, so nothing for Today or the chevrons to act on.
    document.getElementById('todayBtn').hidden=true;
    document.getElementById('relLabel').textContent='Every week';
    buildTimeline();
  }else{
    renderHeader();
  }
  var q=[];
  if(timeline) q.push('view=timeline');
  else if(viewStart!==Week.todayStart()) q.push('week='+viewStart);
  history.replaceState(null,'',location.pathname+(q.length?'?'+q.join('&'):''));
}

// ── Week picker ───────────────────────────────────────────────────────────
function openWeekPicker(){
  var list=document.getElementById('weekpick-list');
  list.innerHTML='';
  var today=Week.todayStart();
  var all=WeekStore.starts().slice();
  if(all.indexOf(today)===-1) all.push(today);
  all.sort().reverse();
  all.forEach(function(start){
    var key=WeekStore.keyFor(start);
    var cached=key?WeekStore.peek(key):null;
    var row=document.createElement('button');
    row.type='button';
    row.className='wp-row'+(start===viewStart?' now':'');
    var rel=Week.relativeLabel(start, today);
    row.innerHTML='<span class="wp-range">'+Week.rangeLabel(start,{year:true})+'</span>'+
      '<span class="wp-meta">'+(cached?((cached.meals||[]).length+' meals'):rel)+'</span>';
    row.addEventListener('click',function(){ closeSheet('weekpick-overlay'); goToWeek(start); });
    list.appendChild(row);
  });
  openSheet('weekpick-overlay');
}

// ── Wire up ───────────────────────────────────────────────────────────────
document.getElementById('prevWk').addEventListener('click', function(){ goToWeek(Week.add(viewStart,-1)); });
document.getElementById('nextWk').addEventListener('click', function(){ goToWeek(Week.add(viewStart, 1)); });
document.getElementById('wkTitle').addEventListener('click', openWeekPicker);
document.getElementById('todayBtn').addEventListener('click', function(){ goToWeek(Week.todayStart()); });
document.getElementById('weekpick-close').addEventListener('click', function(){ closeSheet('weekpick-overlay'); });
document.getElementById('weekpick-overlay').addEventListener('click', function(e){ if(e.target===this) closeSheet('weekpick-overlay'); });
document.getElementById('viewWeekBtn').addEventListener('click', function(){ setView('week'); });
document.getElementById('viewTimeBtn').addEventListener('click', function(){ setView('timeline'); });
if(params.get('view')==='timeline') setView('timeline');

// Swipe left/right to change week. Only when a horizontal intent is clear, so
// it can't fight the vertical scroll, and never while editing (the day rows
// have their own drag).
(function(){
  var pane=document.getElementById('weekPane'), x0=0, y0=0, tracking=false;
  pane.addEventListener('touchstart', function(e){
    if(editMode!=='off' || e.touches.length!==1){ tracking=false; return; }
    tracking=true; x0=e.touches[0].clientX; y0=e.touches[0].clientY;
  }, {passive:true});
  pane.addEventListener('touchend', function(e){
    if(!tracking) return;
    tracking=false;
    var t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(Math.abs(dx)<60 || Math.abs(dx)<Math.abs(dy)*1.8) return;
    goToWeek(Week.add(viewStart, dx<0?1:-1));
  }, {passive:true});
})();

document.getElementById('editBtn').addEventListener('click', enterEdit);
document.getElementById('cancelBtn').addEventListener('click', exitEdit);
document.getElementById('doneBtn').addEventListener('click', save);
document.getElementById('shuffleWeekBtn').addEventListener('click', shuffleWeek);
document.getElementById('picker-close').addEventListener('click', function(){ closeSheet('picker-overlay'); });
document.getElementById('picker-search').addEventListener('input', function(){ renderPickerList(this.value); });
document.getElementById('picker-search').addEventListener('keydown', function(e){
  if(e.key!=='Enter' || !pickerCustomMode) return;
  e.preventDefault();
  if((this.value||'').trim()) addCustomMeal(this.value);
});
document.getElementById('picker-confirm').addEventListener('click', function(){
  addCustomMeal(document.getElementById('picker-search').value);
});
document.getElementById('picker-overlay').addEventListener('click', function(e){ if(e.target===this) closeSheet('picker-overlay'); });
</script>
