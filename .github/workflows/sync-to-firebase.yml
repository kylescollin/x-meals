name: Sync meal data to Firebase

on:
  push:
    branches: [main]
    paths:
      - 'data/weeks/**'
      # Safety net: something may still write the old single-week file.
      - 'data/week.json'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild every current/upcoming grocery list from scratch'
        type: boolean
        default: false

# Two saves a minute apart used to start two runs that raced each other to the
# same branch. They queue now instead. cancel-in-progress is off on purpose —
# a cancelled run is a grocery list nobody ever built.
concurrency:
  group: sync-meals
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history: the commit step rebases before pushing, and a shallow
      # clone has no common ancestor to rebase onto.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd scripts && npm install

      # Anything still writing data/week.json gets folded into data/weeks/
      # before the rest of the pipeline looks at the week data.
      - name: Fold legacy week.json
        run: node scripts/fold-legacy-week.js

      # Guards the week data before anything writes to it: day/date agreement,
      # one document per week, filenames matching their own weekOf.
      - name: Check week data
        run: node scripts/check-weeks.js

      - name: Run tests
        run: |
          node scripts/test-week-merge.js
          node scripts/test-week-store.js
          node scripts/test-recipe-import.js
          node scripts/test-ingredient-format.js

      # Does the least work each week needs: nothing at all for a rearranged
      # week, one scoped call for a meal added or removed. That's what stops
      # this from looping or burning API calls.
      - name: Update grocery lists
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/generate-groceries.js ${{ inputs.force && '--force' || '' }}

      # A rejected push used to fail this step, and the Firebase sync below runs
      # after it — so the list this run had just built reached nobody. Rebase
      # and retry so that's rare, and continue-on-error so that even when it
      # does happen the site still gets the list.
      - name: Commit updated weeks
        id: commit
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weeks
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Update grocery lists"
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected — rebasing onto origin/main and retrying."
            git pull --rebase --autostash origin main
          done
          echo "Could not push after 3 attempts."
          exit 1

      - name: Sync to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/sync-firebase.js

      # The list reached the site above even when git wouldn't take it, but a
      # commit that never landed still has to be visible rather than silently
      # green — git is the source of truth the next run reads from.
      - name: Fail if the commit never landed
        if: steps.commit.outcome == 'failure'
        run: |
          echo "::error::Grocery lists synced to Firebase but could not be pushed to git."
          exit 1
