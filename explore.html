<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#faf7f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Fox & Bear Kitchen">
<script src="icons.js"></script>
<script src="pwa.js" defer></script>
<title>Explore — Fox &amp; Bear Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="theme.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
  .hd{max-width:680px;margin:0 auto 22px;border-bottom:1px solid var(--border);padding:28px 20px 22px;}
  .ey{font-weight:500;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);margin-bottom:10px;}
  h1{font-family:'Playfair Display',serif;font-size:36px;font-weight:700;line-height:1.1;margin-bottom:8px;}
  .hm{font-size:13px;color:var(--muted);font-weight:300;}

  /* Search — same field as the Recipes page. 16px minimum so iOS doesn't zoom. */
  .srch-wrap{max-width:680px;margin:0 auto;padding:0 20px 12px;}
  .srch-field{position:relative;}
  #srch{width:100%;padding:12px 40px 12px 16px;border:1.5px solid var(--border);border-radius:10px;background:#fff;font-family:'DM Sans',sans-serif;font-size:16px;color:var(--ink);outline:none;-webkit-appearance:none;}
  #srch:focus{border-color:var(--accent);}
  #srch::placeholder{color:var(--muted);}
  .srch-x{display:none;position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px;line-height:1;-webkit-tap-highlight-color:transparent;}

  /* Blog chips: one row, scrolls sideways, no scrollbar. */
  .chips{max-width:680px;margin:0 auto;padding:0 20px 18px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;background:#fff;border:1.5px solid var(--border);border-radius:100px;color:var(--ink);font-family:'DM Sans',sans-serif;font-size:13px;padding:7px 13px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s,background .15s,transform .12s;white-space:nowrap;}
  .chip:active{transform:scale(.95);}
  .chip.selected{border-color:var(--accent);background:var(--accent-light);font-weight:500;}
  /* The one chip that isn't a blog: flips the grid to the non-dinner pile. */
  .chip-sweets{border-style:dashed;margin-right:6px;}
  .chip-sweets.selected{border-style:solid;}

  /* The grid: two columns, tiles dropped into whichever is shorter. */
  .grid{max-width:680px;margin:0 auto;padding:0 20px;display:flex;gap:10px;align-items:flex-start;}
  .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;}
  .xt{position:relative;background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s,box-shadow .15s,transform .12s;}
  .xt:hover{border-color:#bbb;box-shadow:0 2px 10px rgba(0,0,0,.06);}
  .xt:active{transform:scale(.985);}
  .xt-img{position:relative;background:#f0ece5;display:flex;align-items:center;justify-content:center;}
  .xt-img img{width:100%;display:block;object-fit:cover;aspect-ratio:4/5;}
  .xt-emoji{display:none;font-size:38px;line-height:1;padding:44px 0;}
  .xt-img.no-img .xt-emoji{display:block;}
  .xt-body{padding:10px 12px 12px;}
  .xt-name{font-family:'Playfair Display',serif;font-size:14px;font-weight:500;line-height:1.3;}
  .xt-sub{font-size:11px;color:var(--muted);margin-top:4px;font-weight:300;}
  .xt-saved{display:none;position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;}
  .xt.saved .xt-saved{display:inline-block;}

  .foot{max-width:680px;margin:0 auto;padding:22px 20px 40px;text-align:center;font-size:12px;color:var(--muted);font-weight:300;}
  .empty{max-width:680px;margin:0 auto;padding:48px 20px;text-align:center;color:var(--muted);font-size:14px;font-weight:300;line-height:1.5;}
  .empty strong{display:block;font-family:'Playfair Display',serif;font-size:20px;font-weight:500;color:var(--ink);margin-bottom:8px;}
  #more{height:1px;}

  /* One toast at a time; it always clears itself. */
  .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;border-radius:100px;padding:11px 18px;font-size:13px;z-index:900;display:flex;gap:16px;align-items:center;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.18);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
  .toast button{background:none;border:none;color:#f5b58a;font-family:'DM Sans',sans-serif;font-weight:600;font-size:13px;cursor:pointer;padding:0;}
  @media(min-width:561px){.toast{bottom:28px;}}
</style>
</head>
<body>
<script src="nav.js"></script>
<div class="hd">
  <div class="ey">Fox &amp; Bear Kitchen</div>
  <h1>Explore</h1>
  <div class="hm" id="hm">Loading…</div>
</div>
<div class="srch-wrap">
  <div class="srch-field">
    <input type="search" id="srch" placeholder="Search new recipes…" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="srch-x" id="srch-x" aria-label="Clear">✕</button>
  </div>
</div>
<div class="chips" id="chips"></div>
<div class="empty" id="empty" style="display:none"></div>
<div class="grid" id="grid">
  <div class="col" id="col-a"></div>
  <div class="col" id="col-b"></div>
</div>
<div id="more"></div>
<div class="foot" id="foot"></div>
<div class="toast" id="toast" role="status"></div>

<script src="ingredient-format.js"></script>
<script src="recipe-import.js"></script>
<script src="recipe-card.js"></script>
<script type="module" src="explore.js"></script>
</body>
</html>
