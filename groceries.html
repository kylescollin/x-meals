<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Grocery List — Fox &amp; Bear Kitchen</title>
<!--
  The grocery list is now a card on the week page: it slides up over whichever
  week you're looking at, from the dock at the bottom of the screen. Same list,
  same shared checkboxes, same hand-added items — you just don't lose your place
  to see it any more. See grocery-sheet.js.

  This file stays rather than being deleted because it's in the service worker's
  shell list and may be bookmarked or pinned to a home screen. It forwards the
  ?week= param through, so an old link to one week's list still lands on that
  week's list.
-->
<link rel="canonical" href="index.html">
<link rel="stylesheet" href="theme.css">
<style>
  body{background:var(--cream);color:var(--muted);font-family:'DM Sans',system-ui,sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px;text-align:center;}
  a{color:var(--accent);}
</style>
<!-- Redirected in script rather than by <meta refresh> because the target
     depends on ?week=. The site needs JavaScript regardless (auth is a module),
     so there's no no-JS path to preserve — just the visible link below. -->
<script>
  (function(){
    var week = new URLSearchParams(location.search).get('week');
    location.replace('index.html?' + (week ? 'week=' + encodeURIComponent(week) + '&' : '') + 'groceries=1');
  })();
</script>
</head>
<body>
  <p>The grocery list now lives on the week page — <a href="index.html?groceries=1">open it</a>.</p>
</body>
</html>
